name: Validate viewer and publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# Prefer latest validated model; obsolete exhaustive runs must not block publishing
# a corrected assembly. Only one Pages deployment is active at a time.
concurrency:
  group: transfer-station-pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.check-pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/parts.js
          node --check src/kinematics.js
          node tests/kinematics.mjs
          node tests/photo-assembly.mjs
          node --check src/photo-library.js
          node --check src/photo-gallery.js
          node tests/photo-library.mjs
          node --check src/photo-947-assembly.js
          node --check tests/photo-947-assembly.mjs
          node tests/photo-947-assembly.mjs
          node --check src/assembly-qa.js
          node --check src/details.js
          node tests/structural-assembly.mjs
          node tests/b-photo147-xy-evidence.mjs
          node --check src/vendor-hardware.js
          node tests/vendor-hardware.mjs
          node --check src/holder-mechanics.js
          node tests/holder-mechanics.mjs
          node --check src/dimension-evidence.js
          node tests/dimension-evidence.mjs
          node --check src/b-photo149-geometry.js
          node tests/b-photo149-geometry.mjs
          node --check src/b-vacuum-routing.js
          node tests/b-vacuum-routing.mjs
          node --check src/assembly-mounts.js
          node tests/assembly-mounts.mjs
          node --check src/pneumatic-dimensions.js
          node tests/pneumatic-dimensions.mjs
          node --check src/b35-fastener-audit.js
          node tests/b35-fastener-audit.mjs
          node --check src/a-photo-scale-calibration.js
          node tests/a-photo-scale-calibration.mjs
          node --check src/v48-ruler-registration.js
          node tests/v48-ruler-registration.mjs
          node --check src/platform-a-assembly-audit.js
          node tests/platform-a-assembly-audit.mjs
          node --check src/a-working-layout.js
          node tests/a-working-layout.mjs
          node --check src/a-control-interfaces.js
          node tests/a-control-interfaces.mjs
          node --check src/a-external-camera.js
          node tests/a-external-camera.mjs
          node --check src/a-thermal-datums.js
          node tests/a-thermal-datums.mjs
          node tests/a-vacuum-clearance.mjs
          node --check tests/a-control-spline-clearance.mjs
          node tests/a-control-spline-clearance.mjs
          node tests/a-photo-angle-registration.mjs
          node --check src/b-physical-audit.js
          node tests/b-profile-audit.mjs
          node --check src/interface-evidence.js
          node --check src/procurement.js
          node tests/procurement-structure.mjs
          node tests/interface-evidence.mjs
          node --check src/cad-registration.js
          node tests/cad-registration.mjs
      - name: Optional CJK fonts (never gate geometry validation on apt mirrors)
        shell: bash
        run: |
          if fc-list :lang=zh family | grep -q .; then
            echo "CJK font already available"
          else
            timeout 35s bash -c 'sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk' || \
              echo "::warning::CJK font download unavailable. Continue geometry checks and mark text renders as font-fallback."
          fi
      - name: Install browser smoke-test runner
        run: npm install --no-save playwright-core
      - name: Check browser regression scripts
        run: |
          node --check tests/smoke.mjs
          node --check tests/model-b-visible-smoke.mjs
      - name: Validate complete model B scene and capture screenshot
        timeout-minutes: 15
        run: |
          python3 -m http.server 8765 > /tmp/transfer-site.log 2>&1 &
          node tests/model-b-visible-smoke.mjs
      - name: Require V136 exploded thermal-layer render and A engineering evidence
        run: |
          mkdir -p assets/photo-review
          for name in \
            Transfer-Station-A-20261108-MonitorFront.png \
            Transfer-Station-A-20261108-MonitorLeft.png \
            Transfer-Station-A-20261108-MonitorRight.png \
            Transfer-Station-A-V133-Control-Routes.png \
            Transfer-Station-A-V135-Heater-Cutaway.png \
            Transfer-Station-A-V136-Wood-Heater-Metal-Exploded.png \
            Transfer-Station-A-V137-XY-Rotary-Lock.png \
            Transfer-Station-A-V138-X-Right-Y-Front.png \
            Transfer-Station-A-V138-Pump-Controller.png \
            Transfer-Station-A-V140-Pump-Controls-Full.png \
            Transfer-Station-A-Photo191-Overview.png \
            Transfer-Station-A-Photo192-Side.png \
            Transfer-Station-A-Photo193-Front.png \
            Transfer-Station-A-Photo194-FilmUpper.png \
            Transfer-Station-A-Photo195-FilmLower.png \
            Transfer-Station-A-Photo196-G40.png \
            Transfer-Station-A-V117-A05-Moving-Clamp-Closeup.png \
            Transfer-Station-A-V117-A05-Fixed-Jaw-Closeup.png \
            Transfer-Station-A-V131-Photo5-Empty-Clamp-Closeup.png \
            Transfer-Station-A-V132-A11-No-Ghost-Closeup.png \
            Transfer-Station-A-V132-A15-No-Ghost-Closeup.png \
            Transfer-Station-A-V132-Film-Stack-Working-Closeup.png \
            Transfer-Station-A-V96-A17-Front-Closeup.png \
            Transfer-Station-A-V106-A18-Optical-Closeup.png \
            Transfer-Station-A-V106-A18-Support-Closeup.png; do
            test -s "$name" || { echo "::error::A real-photo matching render is missing: $name"; exit 1; }
            cp "$name" assets/photo-review/
          done
      - name: Upload A engineering renders to publish job
        uses: actions/upload-artifact@v4
        with:
          name: A-Photo-Comparison-Renders
          path: assets/photo-review/
          if-no-files-found: error
      - name: Upload 3D preview screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Transfer-Station-Preview
          path: |
            Transfer-Station-ModelB-Full-Assembly.png
            Transfer-Station-V55-B-Crossed-Sample-XY.png
            Transfer-Station-V40-Vacuum-Rear-Route.png
            Transfer-Station-V32-Black-Thorlabs-Sample-Board.png
            Transfer-Station-V33-Control-Cabinet-Interior.png
            Transfer-Station-V29-B-Post-Sleeve-Closeup.png
            Transfer-Station-V29-B-Film-Viewer.png
            Transfer-Station-A-Photo191-Overview.png
            Transfer-Station-A-Photo192-Side.png
            Transfer-Station-A-Photo193-Front.png
            Transfer-Station-A-Photo194-FilmUpper.png
            Transfer-Station-A-Photo195-FilmLower.png
            Transfer-Station-A-Photo196-G40.png
            Transfer-Station-A-V117-A05-Moving-Clamp-Closeup.png
            Transfer-Station-A-V117-A05-Fixed-Jaw-Closeup.png
            Transfer-Station-A-V131-Photo5-Empty-Clamp-Closeup.png
            Transfer-Station-A-V132-A11-No-Ghost-Closeup.png
            Transfer-Station-A-V132-A15-No-Ghost-Closeup.png
            Transfer-Station-A-V132-Film-Stack-Working-Closeup.png
            Transfer-Station-A-V133-Control-Routes.png
            Transfer-Station-A-V135-Heater-Cutaway.png
            Transfer-Station-A-V136-Wood-Heater-Metal-Exploded.png
            Transfer-Station-A-V137-XY-Rotary-Lock.png
            Transfer-Station-A-V138-X-Right-Y-Front.png
            Transfer-Station-A-V138-Pump-Controller.png
            Transfer-Station-A-V140-Pump-Controls-Full.png
            Transfer-Station-A-V96-A17-Front-Closeup.png
            Transfer-Station-A-V106-A18-Optical-Closeup.png
            Transfer-Station-A-V106-A18-Support-Closeup.png
            Transfer-Station-A-V111-MGZ30-Family-Topology-Study.png
            Transfer-Station-A-V115-GCM1302M-Vendor-Study.png
            Transfer-Station-A-V116-GCM1102M-Height-Conflict-Study.png
            Transfer-Station-A-20261108-MonitorFront.png
            Transfer-Station-A-20261108-MonitorLeft.png
            Transfer-Station-A-20261108-MonitorRight.png
            Transfer-Station-ModelA-5306M-Base.png
            Transfer-Station-V66-A-Front-Assembly.png
            Transfer-Station-V70-A-Photo-Bare-Foot.png
            Transfer-Station-V58-A-Candidate-Transfer-Contact.png
            Transfer-Station-V46-A-VC13M-Raised.png
            Transfer-Station-V46-A-VC13M-Lowered.png
            Transfer-Station-Preview-B.png
            Transfer-Station-V27-User-Photo-B-Overview.png
            Transfer-Station-V27-User-Photo94-Closeup-B.png
            Transfer-Station-V27-User-Photo95-T25M-B.png
            Transfer-Station-V27-User-Photos-B.png
            Transfer-Station-Film-Stack-B.png
            Transfer-Station-Sample-Stack-B.png
            Transfer-Station-Photo108-magnet-front.png
            Transfer-Station-Photo109-T25M-label.png
            Transfer-Station-Film-Stack-A.png
            Transfer-Station-Sample-Stack-A.png
            Transfer-Station-Rear-Ports-B.png
            Transfer-Station-Detail-B.png
            Transfer-Station-V24-Chuck-Screw-Heads.png
            Transfer-Station-V24-Optical-Left-Grip-B.png
            Transfer-Station-V25-Holder-Detail-B.png
            Transfer-Station-V25-Holder-OEM-Closeup.png
            Transfer-Station-V26-Photo94-G40-L-Bracket-A.png
            Transfer-Station-V26-Photo95-T25M-A.png
            Transfer-Station-V26-Photo97-VC13M-A.png
            Transfer-Station-Preview-A.png
          if-no-files-found: ignore
      - name: Check whether Pages was enabled in repository settings
        id: check-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [ "$CODE" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Enable GitHub Pages: Settings > Pages > Source = GitHub Actions, then rerun this workflow."
          fi
      - name: Upload downloadable source package
        uses: actions/upload-artifact@v4
        with:
          name: Transfer-Station-Interactive-Viewer
          path: |
            index.html
            photo-review.html
            src/
            assets/
            docs/
            cad/
            tests/
            README.md
          retention-days: 90
  publish:
    needs: validate
    if: needs.validate.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Attach the six REAL Three.js render images to public comparison page
        uses: actions/download-artifact@v4
        with:
          name: A-Photo-Comparison-Renders
          path: assets/photo-review
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
