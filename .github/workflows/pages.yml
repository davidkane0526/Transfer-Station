name: Validate viewer and publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# Prevent simultaneous Pages deployments from failing with HTTP 400.
concurrency:
  group: transfer-station-pages
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.check-pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/parts.js
          node --check src/kinematics.js
          node tests/kinematics.mjs
          node tests/photo-assembly.mjs
      - name: Add CJK fonts for accurate screenshot validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Install browser smoke-test runner
        run: npm install --no-save playwright-core
      - name: Exercise full 3D viewer and capture screenshot
        run: |
          python3 -m http.server 8765 > /tmp/transfer-site.log 2>&1 &
          node tests/smoke.mjs
      - name: Upload 3D preview screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Transfer-Station-Preview
          path: |
            Transfer-Station-Preview-B.png
            Transfer-Station-Film-Stack-B.png
            Transfer-Station-Photo108-magnet-front.png
            Transfer-Station-Photo109-T25M-label.png
            Transfer-Station-Film-Stack-A.png
            Transfer-Station-Sample-Stack-A.png
            Transfer-Station-Rear-Ports-B.png
            Transfer-Station-Detail-B.png
            Transfer-Station-Preview-A.png
          if-no-files-found: ignore
      - name: Check whether Pages was enabled in repository settings
        id: check-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [ "$CODE" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Enable GitHub Pages: Settings > Pages > Source = GitHub Actions, then rerun this workflow."
          fi
      - name: Upload downloadable source package
        uses: actions/upload-artifact@v4
        with:
          name: Transfer-Station-Interactive-Viewer
          path: |
            index.html
            src/
            docs/
            cad/
            tests/
            README.md
          retention-days: 90
  publish:
    needs: validate
    if: needs.validate.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
