name: Audit manufacturer NFP-1462C CAD without distributing OEM files
on:
  workflow_dispatch:
  push:
    paths:
      - 'cad/audit_vendor_archive.py'
      - '.github/workflows/audit-vendor-cad.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install archive support and CadQuery
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          python -m pip install 'cadquery>=2.4,<2.8'
      - name: Download OEM CAD and inspect solid geometry locally
        run: |
          python cad/audit_vendor_archive.py \
            --url "https://www.zolix-group.com/public/storage/upload/files/Motioncontrol3D/NFP-1462C.rar" \
            --report build/vendor/NFP-1462C-metadata.json \
            --export-local-stl "$RUNNER_TEMP/NFP-1462C-private.stl"
          test -s "$RUNNER_TEMP/NFP-1462C-private.stl"
          echo "Local-only OEM mesh exists; it will NOT be uploaded to GitHub."
      - name: Verify OEM shell visually in 3D viewer (no CAD upload)
        run: |
          npm install --no-save playwright-core
          python3 -m http.server 8765 > /tmp/transfer-vendor-site.log 2>&1 &
          OEM_STL_PATH="$RUNNER_TEMP/NFP-1462C-private.stl" node tests/vendor-nfp-preview.mjs
      - name: Upload OEM-derived image preview ONLY
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NFP-1462C-OEM-SHELL-RENDER-ONLY
          path: NFP-1462C-OEM-NATIVE-SHELL-PREVIEW.png
          if-no-files-found: ignore
      - name: Upload ONLY public metadata; never redistribute OEM CAD
        uses: actions/upload-artifact@v4
        with:
          name: NFP-1462C-OEM-CAD-METADATA-ONLY
          path: build/vendor/NFP-1462C-metadata.json
          retention-days: 30
