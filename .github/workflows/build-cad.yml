name: Generate editable STEP assemblies
on:
  workflow_dispatch:
  push:
    paths:
      - 'cad/build_assemblies.py'
      - 'cad/validate_interfaces.py'
      - '.github/workflows/build-cad.yml'
permissions:
  contents: read
# Only the newest CAD revision is useful; cancel obsolete builds triggered
# by earlier commits in the same edit batch.
concurrency:
  group: transfer-station-cad
  cancel-in-progress: true
jobs:
  cad:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read CAD revision
        id: cad_revision
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          source = Path("cad/build_assemblies.py").read_text(encoding="utf-8")
          match = re.search(r"""^CAD_REVISION\s*=\s*['"]([^'"]+)['"]""", source, re.MULTILINE)
          if not match:
              raise SystemExit("CAD_REVISION not found in cad/build_assemblies.py")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"value={match.group(1)}\n")
          PY
      - name: Install CadQuery
        run: python -m pip install 'cadquery>=2.4,<2.8'
      - name: Verify A21 lock-ring geometry locally with CadQuery
        run: |
          python tests/test_a21_fixture.py
          python tests/test_a07_physical.py
          python tests/test_a07_wood_sandwich.py
          python tests/test_a139_external_mounts.py
      - name: Generate independent platform A and B parametric STEP assemblies
        run: python cad/build_assemblies.py
      - name: Reject mechanical interpenetrations and validate interface contacts
        run: python cad/validate_interfaces.py
      - name: Upload editable STEP models
        uses: actions/upload-artifact@v4
        with:
          name: Transfer-Station-${{ steps.cad_revision.outputs.value }}-STEP-CAD
          path: build/
          retention-days: 90
