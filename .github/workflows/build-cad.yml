name: Generate editable STEP assemblies
on:
  workflow_dispatch:
  push:
    paths:
      - 'cad/build_assemblies.py'
      - 'cad/validate_interfaces.py'
      - '.github/workflows/build-cad.yml'
permissions:
  contents: read
jobs:
  cad:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CadQuery
        run: python -m pip install 'cadquery>=2.4,<2.8'
      - name: Build and validate both platforms
        run: python cad/build_assemblies.py
      - name: Validate fasteners and interface contacts
        run: python cad/validate_interfaces.py
      - name: Upload editable STEP models
        uses: actions/upload-artifact@v4
        with:
          name: Transfer-Station-V19-STEP-CAD
          path: build/
          retention-days: 90
