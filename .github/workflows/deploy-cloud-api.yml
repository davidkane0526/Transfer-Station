name: Deploy Transfer Station Cloud Database API
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy-cloud-api.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment credentials
        id: credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRITE_TOKEN: ${{ secrets.TRANSFER_STATION_WRITE_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$CF_TOKEN" || -z "$CF_ACCOUNT" || -z "$WRITE_TOKEN" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloud API deployment skipped. Add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and TRANSFER_STATION_WRITE_TOKEN in repository Actions secrets."
            exit 0
          fi
          if [[ ${#WRITE_TOKEN} -lt 32 ]]; then
            echo "::error::TRANSFER_STATION_WRITE_TOKEN must contain at least 32 characters."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.credentials.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.credentials.outputs.ready == 'true'
        with:
          node-version: 22
      - name: Install Wrangler
        if: steps.credentials.outputs.ready == 'true'
        run: npm install --no-save wrangler@4
      - name: Create or reuse D1 database
        if: steps.credentials.outputs.ready == 'true'
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          listing=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$endpoint")
          echo "$listing" | jq -e '.success == true' >/dev/null
          database_id=$(echo "$listing" | jq -r '.result[] | select(.name == "transfer-station-records") | .uuid' | head -n 1)
          if [[ -z "$database_id" || "$database_id" == "null" ]]; then
            created=$(curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data '{"name":"transfer-station-records"}' "$endpoint")
            echo "$created" | jq -e '.success == true' >/dev/null
            database_id=$(echo "$created" | jq -r '.result.uuid')
          fi
          [[ "$database_id" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "::error::Cloudflare returned an invalid D1 database ID."; exit 1; }
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]] || { echo "::error::CLOUDFLARE_ACCOUNT_ID must be 32 hexadecimal characters."; exit 1; }
          sed -i "s/__CLOUDFLARE_ACCOUNT_ID__/$CLOUDFLARE_ACCOUNT_ID/g; s/__D1_DATABASE_ID__/$database_id/g" wrangler.toml
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"
      - name: Apply D1 schema
        if: steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 execute transfer-station-records --remote --file=worker/schema.sql --config=wrangler.toml
      - name: Deploy Worker API
        if: steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config=wrangler.toml
      - name: Configure private write secret
        if: steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TRANSFER_STATION_WRITE_TOKEN: ${{ secrets.TRANSFER_STATION_WRITE_TOKEN }}
        shell: bash
        run: printf '%s' "$TRANSFER_STATION_WRITE_TOKEN" | npx wrangler secret put WRITE_TOKEN --config=wrangler.toml
      - name: Verify deployed database API
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://transfer-station-api.dk-weather.workers.dev/api/health"
          for attempt in {1..10}; do
            if curl -fsS "$endpoint" | jq -e '.ok == true and .database == "ready"'; then
              echo "Cloudflare D1 API is live."
              exit 0
            fi
            sleep 3
          done
          echo "::error::Cloudflare D1 API health check failed."
          exit 1
