<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transfer Station 素材库</title>
<style>
html{color-scheme:dark}body{max-width:1100px;margin:auto;padding:1.25rem;background:#101b28;color:#edf3fa;font:16px system-ui}
header{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap}h1{font-size:1.65rem}a{color:#9cd4ff}
button{color:inherit;background:#1c3247;border:1px solid #486983;border-radius:.4rem;padding:.45rem .75rem;font:inherit;cursor:pointer}
#media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:1rem;margin-top:1rem}
figure{margin:0;padding:.75rem;background:#17283a;border:1px solid #304962;border-radius:.55rem}
figure img,figure video{width:100%;height:150px;object-fit:contain;background:#101b28;border-radius:.25rem}
figcaption{margin:.4rem 0}dialog{max-width:calc(100vw - 3rem);border:1px solid #486983;border-radius:.6rem;color:inherit;background:#101b28}
dialog::backdrop{background:#080d15df}dialog img,dialog video{display:block;max-width:100%;max-height:75vh;object-fit:contain;margin:.6rem 0}
dialog header{align-items:center}dialog h2{margin:.25rem 0;font-size:1.15rem}
</style>
<header><h1>素材库</h1><nav><a href="./index.html">返回装配页面</a> · <a href="./media.html">所有素材</a> · <button id="admin-login" type="button">管理员登录</button></nav></header>
<p id="admin-status" role="status"></p>
<p id="media-status" role="status">正在加载低清预览…</p>
<main id="media-grid" aria-label="实物照片和视频"></main>
<dialog id="original" aria-labelledby="original-title">
  <header><h2 id="original-title">原件</h2><form method="dialog"><button>关闭</button></form></header>
  <p id="original-status" role="status"></p><div id="original-content"></div>
</dialog>
<script type="module" src="./src/media-gallery.js"></script>
</html>
